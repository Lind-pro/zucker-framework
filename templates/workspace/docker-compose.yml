# Local stack for this workspace. All values come from the root `.env` (generated by `zucker create`).
#   docker compose up -d --build          everything (migrations run once in `migrate` before `server`)
#   pnpm dev:infra && pnpm dev            databases and mail in Docker, apps on the host
# Datastores bind to 127.0.0.1 only. Images are built from the workspace root with each app's Dockerfile.

x-server-environment: &server-environment
  NODE_ENV: production
  PORT: "4200"
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD:?run zucker create or set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  FILES_STORAGE_PROVIDER: s3
  FILES_S3_ENDPOINT: http://minio:9000
  # Plain http only to a service on this private network (single-label host such as `minio`); any other
  # endpoint, including one saved later in the admin, still needs https in production.
  FILES_S3_INTERNAL_HTTP: "true"
# <zucker:web>
  # CMS publish hooks reach Web on the private network (WEB_URL is the public origin).
  REVALIDATE_URL: http://web:3000
# </zucker:web>
  # Requests arrive through the web rewrite and the admin nginx on the private compose network.
  TRUST_PROXY: uniquelocal

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible private object storage (SeaweedFS: MinIO no longer publishes community images). The
  # MINIO_ROOT_* account administers it; the application uses the FILES_S3_* account, which may only read,
  # write and list objects in FILES_S3_BUCKET (no bucket creation, no anonymous access). The service keeps
  # the name `minio` so existing .env files and FILES_S3_ENDPOINT stay valid.
  minio:
    image: chrislusf/seaweedfs:4.01
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:?set FILES_S3_BUCKET}
      FILES_S3_ACCESS_KEY_ID: ${FILES_S3_ACCESS_KEY_ID:?set FILES_S3_ACCESS_KEY_ID}
      FILES_S3_SECRET_ACCESS_KEY: ${FILES_S3_SECRET_ACCESS_KEY:?set FILES_S3_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "-c"]
    # The identity file is written inside the container at start (never into the data volume).
    command:
      - |
        set -e
        mkdir -p /data /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<CONFIG
        {"identities":[
          {"name":"root","credentials":[{"accessKey":"$$MINIO_ROOT_USER","secretKey":"$$MINIO_ROOT_PASSWORD"}],"actions":["Admin","Read","Write","List","Tagging"]},
          {"name":"app","credentials":[{"accessKey":"$$FILES_S3_ACCESS_KEY_ID","secretKey":"$$FILES_S3_SECRET_ACCESS_KEY"}],"actions":["Read:$$FILES_S3_BUCKET","Write:$$FILES_S3_BUCKET","List:$$FILES_S3_BUCKET","Tagging:$$FILES_S3_BUCKET"]}
        ]}
        CONFIG
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: creates the private bucket (idempotent).
  minio-init:
    image: chrislusf/seaweedfs:4.01
    depends_on:
      minio:
        condition: service_healthy
    environment:
      FILES_S3_BUCKET: ${FILES_S3_BUCKET:?set FILES_S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if echo "s3.bucket.list" | weed shell -master=minio:9333 2>/dev/null | grep -qE "[[:space:]]$$FILES_S3_BUCKET[[:space:]]"; then
          echo "Bucket $$FILES_S3_BUCKET exists"
        else
          echo "s3.bucket.create -name $$FILES_S3_BUCKET" | weed shell -master=minio:9333 >/dev/null
          echo "Bucket $$FILES_S3_BUCKET ready"
        fi

  # Catches all mail without SMTP authentication: SMTP_USER/SMTP_PASSWORD stay empty, and the server
  # then sends without AUTH. Do not enable MP_SMTP_AUTH* here unless you also set those credentials.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Migrations are an explicit one-shot step, never a server start-up side effect.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrate
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    env_file: .env
    environment:
      <<: *server-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runtime
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *server-environment
    ports:
      - "127.0.0.1:${SERVER_PORT:-4200}:4200"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/api/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
# <zucker:web>

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        # Next.js fixes rewrites and the routed default locale at build time.
        API_URL: http://server:4200/api
        SITE_URL: ${SITE_URL}
        DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
    restart: unless-stopped
    # Only public settings and the shared revalidation secret: the web host never receives server secrets.
    environment:
      API_URL: http://server:4200/api
      SITE_URL: ${SITE_URL}
      ADMIN_URL: ${ADMIN_URL:-}
      SITE_CONFIGURATION_SOURCE: ${SITE_CONFIGURATION_SOURCE:-server}
      # Verifies the server's signed cache revalidation (the same value as the server's).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${WEB_PORT:-4202}:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/robots.txt"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
# </zucker:web>
# <zucker:admin>

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-en}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://server:4200
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${ADMIN_PORT:-4201}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
# </zucker:admin>

volumes:
  postgres-data:
  redis-data:
  minio-data:
