  "@aws-sdk/credential-providers": 3.1124.0
  "@aws-sdk/s3-request-presigner": 3.1124.0
  "@cloudflare/workers-types": 5.20260901.1
  "@types/chrome": 0.2.8
  "@types/node": 20.19.43
  electron-to-chromium: 1.5.419
  eslint-plugin-react-refresh: 0.5.5
  "@prisma/config>deepmerge-ts": 8.0.0
  "exceljs>uuid": 11.1.1
  mysql2: 3.23.1
  openai: 7.8.0
  path-to-regexp: 8.4.2
  react: 19.2.8
  react-dom: 19.2.8
  rolldown: 1.2.6
