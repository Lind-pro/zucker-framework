name: Publish framework packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepared_run_id:
        description: Successful Prepare framework release run ID
        required: true
        type: string
      manifest_sha256:
        description: Approved manifest SHA-256 from that preparation run summary
        required: true
        type: string
      dist_tag:
        description: Must match the prepared distribution tag
        required: true
        default: latest
        type: string

concurrency:
  group: framework-package-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    with:
      # Scoped rendering release; unchanged packages retain their published versions.
      release_packages: '@zucker-framework/media'

  prepare:
    name: Prepare the exact CI-verified bundle
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Install the pinned publishing CLI
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - name: Download the exact bundle from the successful CI jobs
        run: node scripts/prepare-release.mjs download-ci --output artifacts/release

      - name: Verify all versions and tarballs before any upload
        run: node scripts/publish-packages.mjs --bundle artifacts/release --dry-run --tag latest

      - name: Seal the verified bundle
        id: seal
        run: node scripts/prepare-release.mjs seal --bundle artifacts/release --tag latest

      - name: Save the immutable prepared bundle
        uses: actions/upload-artifact@v7
        with:
          name: zucker-framework-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the approved bundle through OIDC
    needs: prepare
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.prepare.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARED_RUN_ID: ${{ github.event_name == 'push' && github.run_id || inputs.prepared_run_id }}
      APPROVED_MANIFEST_SHA256: ${{ github.event_name == 'push' && needs.prepare.outputs.manifest_sha256 || inputs.manifest_sha256 }}
      RELEASE_TAG: ${{ github.event_name == 'push' && 'latest' || inputs.dist_tag }}
    steps:
      # Push, checkout, CI bundle and OIDC identity all refer to the same SHA.
      # Never use workflow_run with a checkout of a different producer commit.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Install the pinned publishing CLI
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - name: Download the approved bundle without building or packing
        run: >-
          node scripts/prepare-release.mjs download-prepared
          --run "$PREPARED_RUN_ID"
          --manifest-sha256 "$APPROVED_MANIFEST_SHA256"
          --output artifacts/release

      - name: Publish the exact reviewed tarballs in dependency order
        run: >-
          node scripts/publish-packages.mjs
          --bundle artifacts/release
          --publish --auth oidc
          --manifest-sha256 "$APPROVED_MANIFEST_SHA256"
          --tag "$RELEASE_TAG"

      - name: Save registry verification results
        uses: actions/upload-artifact@v7
        with:
          name: zucker-framework-published-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/registry-verification.json
          if-no-files-found: error
          retention-days: 30
