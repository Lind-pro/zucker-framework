name: PR checks

# 与发布无关的验证：单元测试、lint、PostgreSQL/Redis 持久化契约。
# main 推送不跑这些（本地 pre-push 钩子已强制执行），只在 PR 上复核。

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24.14.1'

jobs:
  test-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zucker_build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Web template node tests
        # node --test discovers **/*.test.mjs (site shell, proxy, AI polling, chat state, ...); nothing else runs them.
        run: pnpm --filter @zucker-framework/template-web test

      - name: Web template session and component regressions
        run: pnpm test:web

      - name: Lint
        run: pnpm lint

  durable-runtime:
    name: Durable Runtime Contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zucker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zucker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zucker_test
      AI_ACCESS_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/zucker_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PostgreSQL and Redis contract tests
        run: pnpm test:durable-runtime
