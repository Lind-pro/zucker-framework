name: Release framework RC packages

on:
  workflow_dispatch:
    inputs:
      registry_url:
        description: Private npm-compatible registry URL
        required: true
        type: string
      dist_tag:
        description: npm distribution tag
        required: true
        default: rc
        type: string
      dry_run:
        description: Verify publish metadata without uploading packages
        required: true
        default: true
        type: boolean

concurrency:
  group: framework-rc-release
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  release:
    name: Verify and publish immutable RCs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test, and lint
        run: |
          pnpm build
          pnpm test
          pnpm lint

      - name: Build audited RC bundle
        run: pnpm pack:rc

      - name: Upload audited bundle
        uses: actions/upload-artifact@v4
        with:
          name: zucker-framework-rc-${{ github.sha }}
          path: artifacts/rc
          if-no-files-found: error
          retention-days: 30

      - name: Validate npm publish metadata
        if: inputs.dry_run
        run: >-
          pnpm publish:rc --
          --dry-run
          --registry=${{ inputs.registry_url }}
          --tag=${{ inputs.dist_tag }}

      - name: Publish immutable RCs
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN || secrets.NPM_TOKEN }}
        run: >-
          pnpm publish:rc --
          --registry=${{ inputs.registry_url }}
          --tag=${{ inputs.dist_tag }}
