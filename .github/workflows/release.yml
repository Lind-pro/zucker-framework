name: Prepare framework release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm distribution tag for this reviewed bundle
        required: true
        default: latest
        type: string

concurrency:
  group: framework-release-preparation
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Prepare the exact CI-verified bundle
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Install the pinned publishing CLI
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - name: Require successful CI and download its verified bundle
        run: node scripts/prepare-release.mjs download-ci --output artifacts/release

      - name: Verify the exact tarballs with npm without uploading
        run: node scripts/publish-packages.mjs --bundle artifacts/release --dry-run --tag "$RELEASE_TAG"

      - name: Record the reviewed bundle and approval checksum
        run: node scripts/prepare-release.mjs seal --bundle artifacts/release --tag "$RELEASE_TAG"

      - name: Save the immutable reviewed bundle
        uses: actions/upload-artifact@v7
        with:
          name: zucker-framework-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
