name: CI

on:
  workflow_call:
    inputs:
      release_packages:
        description: Comma-separated package names to publish; empty verifies/releases all packages
        type: string
        required: false
        default: ''
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24.14.1'

jobs:
  # 发布链路的唯一 CI 门：干净环境构建 + 制品校验 + 上传。test / lint / 持久化契约
  # 在推送 main 之前由 .githooks/pre-push 在本地强制执行，PR 上由 pr-checks.yml 复核。
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Validate agent instructions
        run: |
          node --test packages/cli/tooling/agent-instructions.test.mjs scripts/check-agent-instructions.test.mjs
          node scripts/check-agent-instructions.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test package content checks
        # Declaration checks alone cannot detect optional peers that a barrel imports at runtime.
        run: node --test scripts/verify-package-content.test.mjs scripts/verify-runtime-dependencies.test.mjs scripts/prepare-package-legal.test.mjs scripts/publish-packages.test.mjs scripts/release-graph.test.mjs scripts/release-github.test.mjs scripts/release-registry.test.mjs scripts/prepare-release.test.mjs

      - name: Build all packages
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zucker_build
        run: pnpm build

      - name: Verify package artifacts outside the workspace
        env:
          RELEASE_PACKAGES: ${{ inputs.release_packages }}
        run: node scripts/verify-package-artifacts.mjs --output artifacts/ci-release

      - name: Save the verified release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: zucker-framework-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-release
          if-no-files-found: error
          retention-days: 30
