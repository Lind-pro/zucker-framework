name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24.14.1'

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Validate agent instructions
        run: |
          node --test packages/cli/tooling/agent-instructions.test.mjs scripts/check-agent-instructions.test.mjs
          node scripts/check-agent-instructions.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test package content checks
        # Declaration checks alone cannot detect optional peers that a barrel imports at runtime.
        run: node --test scripts/verify-package-content.test.mjs scripts/verify-runtime-dependencies.test.mjs scripts/prepare-package-legal.test.mjs scripts/publish-packages.test.mjs scripts/release-graph.test.mjs scripts/release-github.test.mjs scripts/release-registry.test.mjs scripts/prepare-release.test.mjs

      - name: Build all packages
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zucker_build
        run: pnpm build

      - name: Verify package artifacts outside the workspace
        run: node scripts/verify-package-artifacts.mjs --output artifacts/ci-release

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Save the verified release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: zucker-framework-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-release
          if-no-files-found: error
          retention-days: 30

  durable-runtime:
    name: Durable Runtime Contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zucker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zucker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zucker_test
      AI_ACCESS_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/zucker_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PostgreSQL and Redis contract tests
        run: pnpm test:durable-runtime
